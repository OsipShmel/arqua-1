name: CLI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.13', '3.14']
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-extras --python ${{ matrix.python }}
      - name: Test CLI and parser
        run: uv run --no-project python -m pytest backend/agent/tests backend/openapi-parser/tests -q
      - name: Test testing_tools
        run: uv run --no-project python -m pytest backend/testing_tools/tests -q
        env:
          PYTHONUTF8: '1'
      - name: Type-check testing_tools
        run: uv run --no-project mypy --config-file backend/testing_tools/pyproject.toml backend/testing_tools/src backend/testing_tools/tests
      - name: ПМИ acceptance suite
        run: uv run --no-project python -m pytest tests/acceptance -q
        env:
          PYTHONUTF8: '1'
      - name: Verify classroom demo on macOS
        if: runner.os == 'macOS'
        run: uv run --no-project python backend/agent/examples/demo_cli.py --output runs/ci-demo
      - name: Lint CLI
        run: uv run --no-project ruff check backend/agent/src backend/agent/tests backend/agent/examples
      - name: Check formatting
        run: uv run --no-project ruff format --check backend/agent/src backend/agent/tests backend/agent/examples

  tools-image:
    name: Tools Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tools with the shared workspace
        run: docker build -f backend/testing_tools/Dockerfile -t arqa-tools:check .
