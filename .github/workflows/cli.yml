name: CLI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python }}
      - name: Install locked workspace (Python 3.14)
        if: matrix.python == '3.14'
        run: uv sync --locked --all-packages --all-extras
      - name: Install standalone CLI (Python 3.11)
        if: matrix.python == '3.11'
        run: |
          uv venv --python 3.11
          uv pip install -e ./openapi_parser_project -e './backend/agent[dev]'
      - name: Test CLI and parser
        run: uv run --no-project python -m pytest backend/agent/tests openapi_parser_project/tests -q
      - name: Lint CLI
        run: uv run --no-project ruff check backend/agent/src backend/agent/tests
      - name: Check formatting
        run: uv run --no-project ruff format --check backend/agent/src backend/agent/tests
