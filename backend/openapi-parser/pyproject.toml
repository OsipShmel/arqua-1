[project]
name = "openapi-parser"
version = "0.1.0"
description = "Parser for OpenAPI 3.x contracts (file or URL) with an LLM-friendly summary"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
openapi-parser = "openapi_parser.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
